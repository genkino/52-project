name: Deploy blog to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build, and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://blog.52proj.com
    steps:
      - name: Check out source
        # actions/checkout v4 tag resolves to this commit.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v4 tag resolves to this commit.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test approved article filtering
        run: npm test

      - name: Build static site and RSS feeds
        run: npm run build
        env:
          BLOG_SITE_URL: https://blog.52proj.com

      - name: Deploy to the existing Cloudflare Pages project
        # cloudflare/wrangler-action v4 tag resolves to this commit.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=52project-blog --branch=main
