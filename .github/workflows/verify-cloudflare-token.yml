name: Verify Cloudflare Pages token
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    name: Verify Pages token (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    steps:
      - name: Verify account token and existing Pages project access
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<PY
          import http.client
          import json
          import os
          import re
          import sys
          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          if re.fullmatch(r"[0-9a-fA-F]{32}", account_id) is None:
              print("account_verify_http_status=000")
              print("preflight_error_code=1")
              sys.exit(1)
          if not token:
              print("account_verify_http_status=000")
              print("preflight_error_code=2")
              sys.exit(1)
